plugins {
    id 'com.diffplug.spotless' version '8.11.0'
}

repositories {
    mavenCentral()
}

spotless {
    java {
        target 'shared/**/java/**/*.java', 'shared/java/**/*.java', 'common-*/java/**/*.java'
        palantirJavaFormat('2.103.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
