plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom-remap' version '1.19.4'
    id 'com.diffplug.spotless' version '8.11.0'
}

// The test mod JAR is remapped like the release JAR (see versions/shared/band.gradle).
ext.testmodRemapped = true
apply from: '../shared/band.gradle'

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
}

loom {
    mods {
        playerdatarescue {
            sourceSet sourceSets.main
        }
    }
}

def remapTestmodJar = tasks.register('remapTestmodJar', net.fabricmc.loom.task.RemapJarTask) {
    inputFile = tasks.named('testmodJar', Jar).flatMap { it.archiveFile }
    archiveFileName = project.testmodJarName
    destinationDirectory = layout.buildDirectory.dir('testmod')
}

tasks.named('build') { dependsOn remapTestmodJar }
