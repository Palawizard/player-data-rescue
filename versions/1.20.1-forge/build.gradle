plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'com.diffplug.spotless' version '8.11.0'
}

// The test mod JAR is reobfuscated like the release JAR (see versions/shared/band.gradle).
ext.testmodRemapped = true
apply from: '../shared/band.gradle'

minecraft {
    mappings channel: 'official', version: project.minecraft_version
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

reobf {
    testmodJar {}
}

tasks.named('testmodJar') {
    destinationDirectory = layout.buildDirectory.dir('testmod')
    finalizedBy 'reobfTestmodJar'
}

tasks.named('build') { dependsOn 'testmodJar' }
