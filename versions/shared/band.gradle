// Applied by every band after its plugins block. The core is compiled from source into
// each band (ADR-001), with the band's own Java release, so no core JAR is shipped.

def rootProps = new Properties()
rootProject.file('../../gradle.properties').withInputStream { rootProps.load(it) }
rootProps.each { key, value -> project.ext.set(key, value) }

def javaRelease = project.java_release.toInteger()

version = project.mod_version
group = project.mod_group

base {
    archivesName = "player-data-rescue-${project.minecraft_version}-${project.loader_name}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaRelease)
    }
}

sourceSets {
    main {
        java.srcDir rootProject.file('../../core/src/main/java')
    }
}

// Dev-only test mod (docs/TESTING.md): its own source set and JAR under build/testmod,
// never in build/libs, so it cannot reach a release. Loaders that remap add the step
// that produces the final JAR and make 'build' depend on it.
def testmodDirs = ['common', "common-${project.minecraft_version}", "${project.minecraft_version}-${project.loader_name}"]
        .collect { rootProject.file("../../testmod/${it}") }

sourceSets {
    testmod {
        java.srcDirs = testmodDirs.collect { new File(it, 'java') }
        resources.srcDirs = [rootProject.file("../../testmod/${project.minecraft_version}-${project.loader_name}/resources")]
        compileClasspath += sourceSets.main.compileClasspath
    }
}

def testmodJarName = "pdrtest-${project.minecraft_version}-${project.loader_name}.jar"
ext.testmodJarName = testmodJarName

tasks.register('testmodJar', Jar) {
    from sourceSets.testmod.output
    archiveFileName = testmodJarName
    destinationDirectory = layout.buildDirectory.dir(project.findProperty('testmodRemapped') ? 'testmod-dev' : 'testmod')
}

if (!project.findProperty('testmodRemapped')) {
    tasks.named('build') { dependsOn 'testmodJar' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaRelease
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes(
                'Implementation-Title': 'player-data-rescue',
                'Implementation-Version': project.version,
                'Minecraft-Version': project.minecraft_version
        )
    }
}

def metadataProperties = [
        mod_id                 : project.mod_id,
        mod_name               : project.mod_name,
        mod_version            : project.mod_version,
        mod_license            : project.mod_license,
        mod_authors            : project.mod_authors,
        mod_description        : project.mod_description,
        minecraft_version_range: project.minecraft_version_range,
        loader_version_range   : project.loader_version_range
]

tasks.named('processResources', ProcessResources) {
    inputs.properties metadataProperties
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand metadataProperties
    }
}

pluginManager.withPlugin('com.diffplug.spotless') {
    spotless {
        java {
            target 'src/**/*.java'
            palantirJavaFormat('2.103.0')
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
}
