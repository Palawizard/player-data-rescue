plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.diffplug.spotless' version '8.11.0'
}

apply from: '../shared/band.gradle'

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    mods {
        playerdatarescue {
            sourceSet sourceSets.main
        }
    }
}
