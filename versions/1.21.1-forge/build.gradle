plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'com.diffplug.spotless' version '8.11.0'
}

apply from: '../shared/band.gradle'

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    // Forge 52 runs on Mojang names, so the release JAR must keep them: a JAR reobfuscated to SRG
    // fails at its first Minecraft call (ADR-PDR-007). Forge's own 1.20.6 MDK sets the same.
    reobf = false
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

tasks.named('jar', Jar) {
    manifest {
        attributes('MixinConfigs': 'playerdatarescue.mixins.json')
    }
}
