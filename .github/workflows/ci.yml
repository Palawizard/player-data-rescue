name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Commit messages and title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The title goes through an environment variable so it is never parsed as shell code.
      - name: Check commit messages and pull request title
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/check-commit-messages.ps1 -Range "$env:BASE_SHA..$env:HEAD_SHA" -Title $env:PR_TITLE

  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build, check formatting and run tests
        working-directory: core
        run: ./gradlew clean build --no-daemon -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64

  bands:
    name: List bands
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read versions/version-matrix.json
        id: matrix
        run: |
          matrix=$(jq -c '{include: [.bands[] as $b | $b.loaders | to_entries[]
            | {band: $b.id, loader: .key, path: .value.path, artifact: .value.artifact}]}' versions/version-matrix.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-band:
    name: ${{ matrix.band }} ${{ matrix.loader }}
    needs: bands
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bands.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Gradle runs on Java 21 and compiles each band with its own toolchain.
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build
        working-directory: ${{ matrix.path }}
        run: ./gradlew clean build --no-daemon -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Smoke test the release JAR on a real dedicated server
        shell: pwsh
        env:
          BAND: ${{ matrix.band }}
          LOADER: ${{ matrix.loader }}
        run: ./scripts/prod-smoke.ps1 -BandId $env:BAND -Loader $env:LOADER -SkipBuild

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-${{ matrix.artifact }}
          path: |
            build/prod-smoke/*/logs/
            build/prod-smoke/*/*.log
            build/prod-smoke/*/crash-reports/
          if-no-files-found: ignore

      - name: Upload release JAR
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}/build/libs/${{ matrix.artifact }}-*.jar
          if-no-files-found: error

  verify-artifacts:
    name: Verify release artifacts
    needs: build-band
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download release JARs
        uses: actions/download-artifact@v7
        with:
          path: release
          pattern: player-data-rescue-*
          merge-multiple: true

      - name: Check every band and loader JAR
        shell: pwsh
        run: ./scripts/check-release-artifacts.ps1 -ArtifactsRoot release
